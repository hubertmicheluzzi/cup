name: WTTV-Daten abrufen

on:
  schedule:
    - cron: "17 5,17 * * *"   # zweimal täglich: 6:17 und 18:17 Uhr Wiener Winterzeit (Sommerzeit 7:17 / 19:17)
  workflow_dispatch: {}       # Knopf "Run workflow" in GitHub

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          WTTV_API_KEY: ${{ secrets.WTTV_API_KEY }}
        run: python tools/fetch.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
